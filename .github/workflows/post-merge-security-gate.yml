name: Post-merge Security Gate

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post-merge-security-gate:
    uses: KT-TECHUP-PROJECT5/secure_gate/.github/workflows/post-merge-security-gate.yml@codex/d-runtime-dynatrace
    with:
      gate_repository: KT-TECHUP-PROJECT5/secure_gate
      gate_ref: codex/d-runtime-dynatrace
      target_url: ${{ vars.STAGING_URL }}
      scan_path: /posts
      health_path: /posts
      health_expected_status: "200"
      smoke_paths: /login=200,/posts=200,/upload=200|303,/docs=200,/redoc=200
      custom_checks: debug-exposure,docs-exposure,reflected-xss,search-sqli,admin-access,idor
      custom_username: user1
      custom_login_verify_path: /posts
      custom_logged_in_markers: 로그아웃,/logout
      zap_auth_plan: .secure-gate/security/zap/secure-gate-auth-plan.yaml
      zap_auth_username: user1
      dynatrace_environment_url: ${{ vars.DYNATRACE_ENV_URL }}
      dynatrace_problem_selector: ${{ vars.DYNATRACE_PROBLEM_SELECTOR }}
      # App-scoped selectors belong in the caller, not org-wide variables.
      dynatrace_entity_selector: 'type("SERVICE"),entityName.equals("OWASP practice board DAST")'
      dynatrace_service_entity_selector: 'type("SERVICE"),entityName.equals("OWASP practice board DAST")'
    secrets:
      DEPENDENCY_TRACK_URL: ${{ secrets.DEPENDENCY_TRACK_URL }}
      DEPENDENCY_TRACK_API_KEY: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
      DYNATRACE_TOKEN: ${{ secrets.DYNATRACE_TOKEN }}
      ZAP_AUTH_PASSWORD: ${{ secrets.ZAP_AUTH_PASSWORD }}
      CUSTOM_RUNTIME_PASSWORD: ${{ secrets.CUSTOM_RUNTIME_PASSWORD }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Optional hard-gate Discord summary; skipped when secret is unset.
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
